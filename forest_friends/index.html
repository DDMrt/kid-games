<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forest Friends">
<meta name="theme-color" content="#7fd3ff">
<title>Forest Friends</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #7fd3ff;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #start {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#7fd3ff, #c9f1ff 55%, #9be08a 56%, #5cc640);
  }
  #play {
    width: min(42vw, 42vh); height: min(42vw, 42vh); border-radius: 50%; border: none;
    background: #4cc93a; box-shadow: 0 14px 0 #2b8a00; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    animation: pulse 1.2s ease-in-out infinite;
  }
  #play svg { width: 48%; height: 48%; margin-left: 9%; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="start">
  <button id="play" aria-label="Play">
    <svg viewBox="0 0 10 10"><polygon points="1,0 10,5 1,10" fill="#fff"/></svg>
  </button>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;

  // ---------- World constants (world units; the world is 720 units tall) ----------
  const VH = 720, GY = 610, LEVEL_W = 5600, GATE_X = 5200, LOCK_Y = 470;
  const WALK = 300, GRAV = 2300, JUMP_V = 920, DJUMP_V = 820, GLIDE = 210;

  let W = 0, H = 0, S = 0, dpr = 1, sc = 1, offY = 0, viewW = 0, viewTop = 0;
  let skyGrad = null, sunGrad = null, caveGrad = null, BTN = {};
  let state = 'title', T = 0, camX = 0;

  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
  const lerp = (a, b, k) => a + (b - a) * k;
  const easeInOut = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  const easeOut = k => 1 - Math.pow(1 - k, 3);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight; S = Math.min(W, H);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    sc = Math.min(H / VH, W / 760);
    offY = H - VH * sc; viewW = W / sc; viewTop = -offY / sc;
    caveGrad = ctx.createLinearGradient(0, 0, 0, H);
    caveGrad.addColorStop(0, '#1d1538'); caveGrad.addColorStop(1, '#3a2b63');
    skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#7fd3ff'); skyGrad.addColorStop(0.55, '#c9f1ff'); skyGrad.addColorStop(1, '#fff3cf');
    sunGrad = ctx.createRadialGradient(W * 0.82, H * 0.1, 0, W * 0.82, H * 0.1, S * 0.45);
    sunGrad.addColorStop(0, 'rgba(255,250,215,0.95)'); sunGrad.addColorStop(1, 'rgba(255,250,215,0)');
    const R = clamp(S * 0.11, 34, 72), pad = Math.max(18, R * 0.45);
    // Left: a + shaped pad (up/down/left/right). Right: jump.
    const br = R * 0.82, d = R * 1.32, cx = pad + d + br, cy = H - pad - d - br;
    BTN = {
      pad: { x: cx, y: cy },
      up: { x: cx, y: cy - d, r: br },
      down: { x: cx, y: cy + d, r: br },
      left: { x: cx - d, y: cy, r: br },
      right: { x: cx + d, y: cy, r: br },
      jump: { x: W - pad - R * 1.3, y: H - pad - R * 1.3, r: R * 1.3 },
    };
    layoutCards();
  }

  // ---------- Level layout ----------
  // Each tree: x position and branches [y, side (-1 left / 1 right), length].
  const TREES = [
    { x: 500, b: [[480, 1, 170]] },
    { x: 1050, b: [[470, -1, 160], [340, 1, 180]] },
    { x: 1650, b: [[460, 1, 200], [320, -1, 170]] },
    { x: 2250, b: [[470, -1, 180], [350, 1, 160], [230, -1, 150]] },
    { x: 2850, b: [[470, 1, 170], [350, -1, 170], [230, 1, 190]] }, // the key tree
    { x: 3500, b: [[460, -1, 190], [330, 1, 170]] },
    { x: 4100, b: [[470, 1, 180], [340, -1, 160]] },
    { x: 4650, b: [[450, -1, 170]] },
  ];
  const PLATS = [];
  for (const t of TREES) for (const [y, side, len] of t.b) {
    PLATS.push({ y, side, tx: t.x, x1: side > 0 ? t.x + 25 : t.x - 35 - len, x2: side > 0 ? t.x + 35 + len : t.x - 25 });
  }
  // Secret cave: its mouth sits on the forest floor at CAVE_X; press up there to go in.
  // Inside is a small room (CAVE_W wide) with the key on a high ledge, and the way out at CAVE_EXIT_X.
  const CAVE_X = 3120, CAVE_W = 1500, CAVE_EXIT_X = 170;
  const CAVE_PLATS = [{ x1: 620, x2: 830, y: 470, rock: true }, { x1: 900, x2: 1130, y: 360, rock: true }];
  const KEY_POS = { x: 1015, y: 300 }; // inside the cave
  const CRYSTALS = [
    [330, GY, 1.1, '#7be0ff'], [520, GY, 0.8, '#ff8fd8'], [760, 470, 0.7, '#c8a2ff'], [1200, GY, 1.3, '#7be0ff'],
    [1350, GY, 0.9, '#ff8fd8'], [1080, 360, 0.6, '#7be0ff'], [430, 140, -0.9, '#c8a2ff'], [880, 120, -1.1, '#7be0ff'],
    [1280, 150, -0.8, '#ff8fd8'], [640, 110, -0.7, '#7be0ff'],
  ];
  // [kind, x, minX, maxX, surfaceY]
  const ENEMY_DEFS = [
    ['beetle', 850, 700, 980, GY], ['beetle', 1420, 1260, 1560, GY], ['beetle', 1780, 1700, 1870, 460],
    ['slime', 2000, 1880, 2120, GY], ['beetle', 2600, 2480, 2700, GY], ['slime', 3350, 3290, 3440, GY],
    ['slime', 3620, 3550, 3690, 330], ['beetle', 3900, 3760, 4020, GY], ['beetle', 4400, 4280, 4520, GY],
    ['slime', 4850, 4740, 4980, GY],
  ];

  const FLOWER_COLORS = ['#ff6fa8', '#ffd23f', '#b48cff', '#ff8c42', '#6ec6ff', '#ffffff'];
  const RAINBOW = ['#ff4d6d', '#ff9f1c', '#ffd60a', '#4cc93a', '#3a86ff', '#9d4edd'];
  const SPARK = ['#fff7a8', '#ffffff', '#ffe066', '#c9f7ff'];
  const LEAF_COLORS = ['#7ccf5a', '#f5b942', '#ff8c42', '#a8e05f', '#e9c46a'];
  const BUTTERFLY_COLORS = [['#ff7ab6', '#ffc2de'], ['#ffd23f', '#fff0a8'], ['#6ec6ff', '#c9ecff'], ['#c38bff', '#e7d4ff'], ['#ff9f43', '#ffd8a8']];
  const FAIRY = ['#ffb3e6', '#d9b8ff', '#b8f0ff', '#ffffff', '#fff3a8'];
  const SLIME = { body: '#c7a4f5', base: '#9f78dc', light: '#efe3ff', mouth: '#5b3a8f' }; // lilac, so it stands out from the greens
  // Five acorns, each sitting on a branch: [x, y]
  const ACORN_POS = [[640, 440], [1200, 300], [2120, 190], [3650, 290], [3970, 300]];

  const FLOWERS = [], MUSH = [], MOTES = [];
  for (let i = 0; i * 70 < LEVEL_W; i++) {
    if (hash(i * 7.7) < 0.35) continue;
    FLOWERS.push({ x: i * 70 + hash(i * 3.3) * 40, h: 22 + hash(i * 9.1) * 22,
      c: FLOWER_COLORS[(hash(i * 4.4) * FLOWER_COLORS.length) | 0], ph: hash(i * 1.9) * TAU });
  }
  for (let i = 0; i * 330 < LEVEL_W; i++) {
    if (hash(i * 13.1) < 0.4) continue;
    MUSH.push({ x: i * 330 + 120 + hash(i * 2.2) * 100, c: hash(i * 6.6) < 0.5 ? '#ff5d73' : '#b48cff', s: 0.8 + hash(i * 8.8) * 0.5, ph: hash(i) * TAU });
  }
  for (let i = 0; i < 160; i++) {
    MOTES.push({ x: hash(i * 1.3) * LEVEL_W, y: 140 + hash(i * 2.7) * 440, ph: hash(i * 5.1) * TAU, s: 0.6 + hash(i * 8.3) * 0.8 });
  }

  // ---------- Sound (all synthesized) ----------
  let actx = null, master = null, noiseBuf = null;
  function initAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  }
  function tone(f, when = 0, dur = 0.3, type = 'triangle', vol = 0.3, f2 = 0) {
    if (!actx) return;
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(when, dur, freq, q, vol, type = 'bandpass') {
    if (!actx) return;
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.3), actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    }
    const t = actx.currentTime + when;
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.05);
  }
  function woof(when) {
    if (!actx) return;
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(170, t + 0.18);
    f.type = 'lowpass'; f.frequency.value = 1100;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.3);
  }
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
  const SFX = {
    jump(kind) {
      const b = { squirrel: 440, puppy: 350, raccoon: 400, bird: 560 }[kind] || 440;
      tone(b, 0, 0.2, 'sine', 0.32, b * 2.1); tone(b * 2, 0.02, 0.12, 'triangle', 0.08, b * 3);
    },
    flutter() { tone(660, 0, 0.16, 'triangle', 0.2, 1320); tone(1318.5, 0.06, 0.3, 'sine', 0.14); tone(1760, 0.12, 0.3, 'sine', 0.1); },
    land() { noise(0, 0.09, 300, 0.9, 0.22, 'lowpass'); },
    stomp(n) {
      noise(0, 0.14, 1700, 0.8, 0.45);
      const f = PENTA[n % PENTA.length];
      tone(f, 0.02, 0.35, 'triangle', 0.35); tone(f * 1.5, 0.1, 0.35, 'sine', 0.18);
    },
    boing() {
      if (!actx) return;
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain(), l = actx.createOscillator(), lg = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(170, t + 0.4);
      l.frequency.value = 16; lg.gain.value = 40; l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      o.connect(g); g.connect(master);
      o.start(t); l.start(t); o.stop(t + 0.5); l.stop(t + 0.5);
    },
    key() {
      [1046.5, 1318.5, 1568, 2093].forEach((f, i) => { tone(f, i * 0.08, 0.5, 'sine', 0.22); tone(f * 2, i * 0.08, 0.25, 'sine', 0.05); });
    },
    locked() { tone(392, 0, 0.16, 'triangle', 0.3); tone(311, 0.18, 0.28, 'triangle', 0.3); },
    open() {
      [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => tone(f, i * 0.07, 0.5, 'triangle', 0.22));
      for (let i = 0; i < 8; i++) tone(rand(2000, 4000), 0.4 + i * 0.06, 0.25, 'sine', 0.06);
    },
    win() {
      [[523.25, 0], [659.25, 0.15], [783.99, 0.3], [1046.5, 0.45], [783.99, 0.65], [1046.5, 0.8], [1318.5, 1.0]]
        .forEach(([f, w]) => { tone(f, w, 0.35, 'triangle', 0.28); tone(f / 2, w, 0.35, 'sine', 0.12); });
    },
    hop() { tone(700, 0, 0.15, 'sine', 0.18, 1100); },
    drop() { tone(620, 0, 0.18, 'sine', 0.22, 260); },
    // A different fun sound for acorns 1-4 (5 gets the cheer).
    acorn(n) {
      if (n === 1) { tone(523.25, 0, 0.12, 'square', 0.12); tone(783.99, 0.09, 0.28, 'square', 0.12); }
      else if (n === 2) { tone(380, 0, 0.4, 'sine', 0.28, 1700); tone(1700, 0.38, 0.15, 'sine', 0.15, 2000); }
      else if (n === 3) { for (let i = 0; i < 5; i++) tone(500 + i * 180, i * 0.07, 0.09, 'sine', 0.26, 1100 + i * 300); }
      else { [659.25, 783.99, 1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, i * 0.06, 0.3, 'triangle', 0.2)); }
    },
    cheer() {
      if (!actx) return;
      const t0 = actx.currentTime;
      for (let v = 0; v < 7; v++) { // a little crowd going "yaaay"
        const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
        const l = actx.createOscillator(), lg = actx.createGain();
        const base = rand(260, 480), st = t0 + rand(0, 0.12);
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(base, st);
        o.frequency.linearRampToValueAtTime(base * 1.5, st + 0.35);
        o.frequency.linearRampToValueAtTime(base * 1.3, st + 1.3);
        l.frequency.value = rand(5, 7); lg.gain.value = base * 0.03; l.connect(lg); lg.connect(o.frequency);
        f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 1.2;
        g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.07, st + 0.1);
        g.gain.setValueAtTime(0.07, st + 0.9); g.gain.exponentialRampToValueAtTime(0.0001, st + 1.5);
        o.connect(f); f.connect(g); g.connect(master);
        o.start(st); l.start(st); o.stop(st + 1.6); l.stop(st + 1.6);
      }
      for (let i = 0; i < 16; i++) noise(0.1 + i * 0.08 + rand(0, 0.04), 0.06, 1500, 0.7, 0.3); // clapping
      [[523.25, 0], [659.25, 0.12], [783.99, 0.24], [1046.5, 0.4]].forEach(([fr, w]) => tone(fr, w, 0.45, 'triangle', 0.22));
    },
    portal() {
      noise(0, 0.28, 900, 0.6, 0.25, 'lowpass');
      [783.99, 1046.5, 1318.5, 1568].forEach((f, i) => tone(f, 0.05 + i * 0.06, 0.35, 'sine', 0.16));
    },
    sparkle() { tone(pick(PENTA) * 2, 0, 0.25, 'sine', 0.12); },
    voice(kind) {
      if (kind === 'squirrel') for (let i = 0; i < 3; i++) tone(1700 + i * 200, i * 0.1, 0.07, 'sine', 0.25, 2600 + i * 200);
      else if (kind === 'puppy') { woof(0); woof(0.28); }
      else if (kind === 'raccoon') for (let i = 0; i < 6; i++) tone(i % 2 ? 1050 : 850, i * 0.055, 0.05, 'triangle', 0.22, i % 2 ? 900 : 1000);
      else { tone(2300, 0, 0.12, 'sine', 0.22, 3500); tone(2700, 0.16, 0.16, 'sine', 0.22, 3900); tone(3000, 0.36, 0.1, 'sine', 0.18, 3600); }
    },
  };

  // ---------- Input ----------
  const pointers = new Map(); // pointerId -> 'left' | 'right' | 'up' | 'down' | 'jump'
  const keys = { left: false, right: false, up: false, down: false, jump: false };
  const input = { left: false, right: false, up: false, down: false, jump: false };
  let jumpQueued = false, upQueued = false;
  // Right half of the screen is jump. Anywhere on the left half picks the cross
  // direction closest to the finger (measured from the cross's center).
  function roleFor(x, y) {
    if (x > W * 0.5) return 'jump';
    const dx = x - BTN.pad.x, dy = y - BTN.pad.y;
    if (Math.abs(dx) >= Math.abs(dy)) return dx < 0 ? 'left' : 'right';
    return dy < 0 ? 'up' : 'down';
  }
  function refreshInput() {
    for (const k of ['left', 'right', 'up', 'down', 'jump']) input[k] = keys[k] || pad[k];
    for (const r of pointers.values()) input[r] = true;
  }

  // Game controller (Xbox etc.): left stick or D-pad moves, A/B/X/Y all jump.
  const pad = { left: false, right: false, up: false, down: false, jump: false, active: false };
  const padPrev = { left: false, right: false, up: false, down: false, jump: false };
  function pollPad() {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    const now = { left: false, right: false, up: false, down: false, jump: false };
    let any = false;
    for (const g of gps) {
      if (!g || !g.connected) continue;
      any = true;
      const b = i => !!(g.buttons[i] && g.buttons[i].pressed);
      const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
      now.left = now.left || ax < -0.4 || b(14);
      now.right = now.right || ax > 0.4 || b(15);
      now.up = now.up || ay < -0.5 || b(12);
      now.down = now.down || ay > 0.5 || b(13);
      now.jump = now.jump || b(0) || b(1) || b(2) || b(3);
    }
    const pressed = {};
    for (const k in now) { pressed[k] = now[k] && !padPrev[k]; padPrev[k] = now[k]; pad[k] = now[k]; }
    pad.active = any;
    return pressed;
  }
  let padSel = 0, winSel = 0;
  function clearInput() {
    pointers.clear(); for (const k in keys) keys[k] = false; jumpQueued = upQueued = false; refreshInput();
  }

  // ---------- Particles ----------
  const particles = [], rings = [], uiParts = [];
  function burst(x, y, n, colors, speed = 1, star = 0.5, size = 1, grav = 900, list = particles) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, sp = 380 * speed * (0.4 + Math.random());
      list.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200 * speed, life: 0, max: 0.7 + Math.random() * 0.6,
        color: pick(colors), size: (5 + Math.random() * 6) * size, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10,
        star: Math.random() < star, g: grav });
    }
  }
  function updateParts(list, dt) {
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i];
      p.life += dt;
      if (p.life > p.max) { list.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
  }

  // ---------- Ambience (butterflies, falling leaves) ----------
  const butterflies = [], leaves = [];
  let leafTimer = 0;
  function spawnButterfly(b, anywhere) {
    b.c = pick(BUTTERFLY_COLORS); b.dir = Math.random() < 0.5 ? -1 : 1;
    b.vx = b.dir * rand(35, 80);
    b.x = anywhere ? camX + Math.random() * viewW : (b.dir > 0 ? camX - 60 : camX + viewW + 60);
    b.by = rand(220, 540); b.ph = Math.random() * TAU; b.f = rand(1, 2); b.s = rand(0.8, 1.3); b.y = b.by;
  }
  function updateAmbience(dt) {
    if (!butterflies.length) for (let i = 0; i < 7; i++) { const b = {}; spawnButterfly(b, true); butterflies.push(b); }
    for (const b of butterflies) {
      b.x += b.vx * dt;
      b.y = b.by + Math.sin(T * b.f + b.ph) * 40 + Math.sin(T * 4.3 + b.ph) * 8;
      if (b.x < camX - 150 || b.x > camX + viewW + 150) spawnButterfly(b, false);
    }
    leafTimer -= dt;
    if (leafTimer < 0) {

  // ---------- Game state ----------
  let player = null, enemies = [], key = null, gate = null, stompCount = 0, winT = 0, confettiT = 0, hopT = 0;

  let area = 'forest', trans = null, portalHere = null, upBuf = 0;

  function startLevel(kind) {

      extra: true, inv: 0, t: 0, sx: 1, sy: 1, blinkT: 2, blink: false, happy: false, dropT: 0 };
    enemies = ENEMY_DEFS.map(([k, x, min, max, y], i) => ({ kind: k, x, min, max, y, oy: 0, vy: 0, dir: i % 2 ? 1 : -1,
      t: Math.random() * 5, alive: true, bonk: 0, hopT: rand(0.5, 1.5), land: 0 }));

    gate = { state: 'closed', t: 0, shake: 0, hint: 0, cool: 0, open: 0, kx: 0, ky: 0 };

    acornCount = 0; popNum = null;
    particles.length = 0; rings.length = 0; uiParts.length = 0;

    clearInput();

  function cameraTarget() {

  // The portal the player is standing at, if any (with where to draw the up-arrow hint).
  function findPortal() {

  function usePortal(pt) {

    trans = { t: 0, dur: 0.9, done: false, color: pt.kind === 'gate' ? '255,250,220' : '24,16,48', go() {

  function updatePlayer(dt, auto) {
    const p = player;
    p.t += dt;

    ctx.fillStyle = '#82dd5e'; ctx.fillRect(x0, GY - 4, x1 - x0, 5);
    ctx.fillStyle = '#4fb83a'; ctx.beginPath();
    for (let x = Math.floor(x0 / 14) * 14; x < x1; x += 14) {
      const sway = Math.sin(T * 2 + x * 0.05) * 3;
      ctx.moveTo(x, GY - 2); ctx.lineTo(x + 5, GY - 2); ctx.lineTo(x + 2 + sway, GY - 10 - hash(x) * 8);
    }
    ctx.fill();
  }
  function drawDecor() {
    const x0 = camX - 60, x1 = camX + viewW + 60;
    for (const m of MUSH) {
      if (m.x < x0 || m.x > x1) continue;
      ctx.save(); ctx.translate(m.x, GY); ctx.scale(m.s, m.s);
      circ(0, -16, 28, `rgba(255,243,160,${0.18 + 0.1 * Math.sin(T * 2 + m.ph)})`);
      ell(0, -8, 6, 10, 0, '#fff6e8');
      ctx.fillStyle = m.c; ctx.beginPath(); ctx.ellipse(0, -16, 17, 13, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
      circ(-7, -21, 2.8, '#fff'); circ(5, -24, 2.4, '#fff'); circ(10, -18, 2, '#fff');
      ctx.restore();
    }
    for (const f of FLOWERS) {
      if (f.x < x0 || f.x > x1) continue;
      const sway = Math.sin(T * 1.8 + f.ph) * 6, tx = f.x + sway, ty = GY - f.h;
      ctx.strokeStyle = '#3e9a3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(f.x, GY); ctx.quadraticCurveTo(f.x, GY - f.h * 0.5, tx, ty); ctx.stroke();
      ell(f.x + sway * 0.3 + 5, GY - f.h * 0.35, 6, 3, -0.5, '#4fb83a');
      const spin = Math.sin(T + f.ph) * 0.2;
      for (let k = 0; k < 5; k++) {
        const a = k * TAU / 5 + spin;
        circ(tx + Math.cos(a) * 7, ty + Math.sin(a) * 7, 5.5, f.c);
      }
      circ(tx, ty, 4.5, '#ffe066');
    }
  }
  function drawGateBack() {
    const gx = GATE_X;
    keyGlow(gx, 470, 260, 0.25 + gate.open * 0.6);
    if (gate.open > 0) {
      ctx.save(); ctx.globalAlpha = gate.open * 0.55; ctx.lineWidth = 16;
      RAINBOW.forEach((c, i) => { ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(gx + 330, GY + 20, 300 - i * 16, Math.PI, 0); ctx.stroke(); });
      ctx.restore();
    }
  }
  function drawGateFront() {
    const gx = GATE_X, L = gx - 80, R = gx + 80, ac = 410;
    const sh = gate.shake > 0 ? Math.sin(gate.shake * 60) * 3 : 0;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(L, GY); ctx.lineTo(L, ac); ctx.arc(gx, ac, 80, Math.PI, 0); ctx.lineTo(R, GY); ctx.closePath(); ctx.clip();
    const dw = 80 * (1 - gate.open * 0.88);
    for (const s of [1, -1]) {
      const x0 = s > 0 ? L + sh : R + sh - dw;
      ctx.fillStyle = '#b5733f'; ctx.fillRect(x0, 320, dw, GY - 320);
      ctx.strokeStyle = '#94592c'; ctx.lineWidth = 3;
      for (let k = 1; k < 3; k++) { ctx.beginPath(); ctx.moveTo(x0 + dw * k / 3, 320); ctx.lineTo(x0 + dw * k / 3, GY); ctx.stroke(); }
      ctx.fillStyle = '#e0b040'; ctx.fillRect(x0, 400, dw, 8); ctx.fillRect(x0, 545, dw, 8);
    }
    ctx.restore();
    if (gate.state === 'closed' || gate.state === 'unlock') {
      const lx = gx + sh, ly = LOCK_Y;
      ctx.strokeStyle = '#c99a1a'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(lx, ly - 12, 11, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#ffcf33'; rr(lx - 17, ly - 12, 34, 28, 6); ctx.fill();
      circ(lx, ly, 4, '#7a5a00'); ctx.fillStyle = '#7a5a00'; ctx.fillRect(lx - 1.5, ly, 3, 8);
    }
    for (const px of [L - 20, R + 20]) {
      ctx.fillStyle = '#c2bcd6'; ctx.fillRect(px - 20, ac, 40, GY - ac);
      ctx.strokeStyle = '#a39cbc'; ctx.lineWidth = 2.5;
      for (let yy = ac + 35; yy < GY; yy += 35) { ctx.beginPath(); ctx.moveTo(px - 20, yy); ctx.lineTo(px + 20, yy); ctx.stroke(); }
      ctx.fillStyle = '#d4cfe4'; rr(px - 26, GY - 18, 52, 18, 5); ctx.fill();
    }
    ctx.strokeStyle = '#c2bcd6'; ctx.lineWidth = 40;
    ctx.beginPath(); ctx.arc(gx, ac, 100, Math.PI, 0); ctx.stroke();
    ctx.strokeStyle = '#a39cbc'; ctx.lineWidth = 2.5;
    for (let k = 1; k < 6; k++) {
      const a = Math.PI + k * Math.PI / 6;
      ctx.beginPath(); ctx.moveTo(gx + Math.cos(a) * 80, ac + Math.sin(a) * 80); ctx.lineTo(gx + Math.cos(a) * 120, ac + Math.sin(a) * 120); ctx.stroke();
    }
    for (let k = 0; k <= 10; k++) {
      const a = Math.PI + k * Math.PI / 10, r = 100 + Math.sin(k * 2.3) * 14;
      const x = gx + Math.cos(a) * r, y = ac + Math.sin(a) * r;
      circ(x, y, 9, k % 2 ? '#4fb357' : '#63c766');
      if (k % 3 === 1) circ(x + 3, y - 3, 5, k % 2 ? '#ff6fa8' : '#ffd23f');
    }
    const gemA = 0.5 + 0.5 * Math.sin(T * 3);
    keyGlow(gx, ac - 100, 30, 0.4 + 0.4 * gemA);
    circ(gx, ac - 100, 11, '#7be0ff'); circ(gx - 3, ac - 103, 3.5, '#ffffff');
  }
  function drawMotes() {
    const x0 = camX - 40, x1 = camX + viewW + 40;
    for (const m of MOTES) {
      if (m.x < x0 || m.x > x1) continue;
      const x = m.x + Math.sin(T * 0.5 + m.ph) * 24, y = m.y + Math.cos(T * 0.7 + m.ph) * 18;
      const a = 0.5 + 0.5 * Math.sin(T * 3 + m.ph * 2);

  }
  function drawButterflies() {
    for (const b of butterflies) {

      const flap = 0.25 + 0.75 * Math.abs(Math.sin(T * 13 + b.ph));

        ctx.restore();
      }
      ell(0, 0, 2.5, 9, 0, '#3a2d4a');
      ctx.strokeStyle = '#3a2d4a'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-1, -8); ctx.lineTo(-5, -15); ctx.moveTo(1, -8); ctx.lineTo(5, -15); ctx.stroke();

  }
  function drawLeaves() {
    for (const l of leaves) {
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot); ctx.scale(l.s, l.s); ctx.globalAlpha = Math.max(0, l.fade);
      ctx.fillStyle = l.c;

  function drawParticleList(list) {
    for (const p of list) {

      const tw = p.g < 0 ? 0.55 + 0.45 * Math.sin(p.life * 28 + p.rot * 3) : 1;
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max) * tw;

      if (p.star) { starPath(p.x, p.y, p.size * 1.4, p.rot); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.8, 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    const p = player;
    let sy = GY;
    for (const pl of areaPlats()) if (p.x > pl.x1 - 12 && p.x < pl.x2 + 12 && pl.y >= p.y - 1 && pl.y < sy) sy = pl.y;
    const k = clamp(1 - (sy - p.y) / 400, 0.3, 1);
    ell(p.x, sy, 24 * k, 5 * k, 0, 'rgba(40,60,30,0.2)');
    if (p.inv > 0 && Math.floor(p.inv * 14) % 2) ctx.globalAlpha = 0.5;
    drawAnimal(p.kind, p.x, p.y, 1, p.face, { t: p.t, run: p.onGround ? Math.abs(p.vx) / WALK : 0, air: !p.onGround,
      sx: p.sx, sy: p.sy, blink: p.blink, happy: p.happy });
    ctx.globalAlpha = 1;
  }

  function drawScene(withGame) {
    const inCave = withGame && area === 'cave';
    if (inCave) drawCave();
    else {
      drawSky();
      drawHills(0.1, 430, '#d2f0e0', 170, 120, 70, 0);
      drawHills(0.25, 500, '#b3e3c7', 140, 100, 70, 300);
      drawMid();
      drawRays();
      drawTrees();
      if (withGame) drawGateBack();
      drawGround();
      if (withGame) drawGateFront();
      drawDecor();

    }
    if (withGame) {
      if (!key.got && key.area === area) {

        }

      }
      drawPlayer();
      if (portalHere) drawUpHint(portalHere);
      if (key.got && gate.state !== 'opening' && gate.state !== 'open') {
        keyGlow(key.fx, key.fy, 45, 0.6);

        const bx = p.x + 50, by = p.y - 160 + Math.sin(T * 3) * 5;

        ctx.globalAlpha = 1 - k; ctx.strokeStyle = rg.color; ctx.lineWidth = 6;

  // ---------- HUD and on-screen buttons ----------
  function drawHUD() {
    screen();

    const pulse = gate.hint > 0 ? 1 + 0.15 * Math.sin(T * 12) : 1;

    ctx.strokeStyle = key.got ? '#ffcf33' : 'rgba(255,255,255,0.9)'; ctx.lineWidth = r * 0.1;

    // Acorn counter, e.g. "2/5", next to the key slot

    ctx.save(); ctx.translate(cx + w / 2, y); ctx.scale(bump, bump);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.strokeStyle = acornCount === ACORN_POS.length ? '#ffcf33' : 'rgba(255,255,255,0.9)'; ctx.lineWidth = r * 0.1; ctx.stroke();
    drawAcorn(-w / 2 + h * 0.5, 0, r / 30);

    ctx.restore();
  }

  // The big bouncing number in the middle of the screen when an acorn is picked up.
  function drawPopNum() {
    if (!popNum) return;
    screen();
    const t = popNum.t, dur = popNum.big ? 2.8 : 1.5;
    const grow = easeOut(Math.min(1, t / 0.2));
    const wobble = 1 + Math.sin(t * 14) * Math.exp(-t * 3.5) * 0.3;
    const hop = Math.abs(Math.sin(t * (popNum.big ? 8 : 7))) * Math.exp(-t * (popNum.big ? 1 : 2)) * S * 0.1;
    const size = S * (popNum.big ? 0.46 : 0.34) * grow * wobble;
    if (size < 1) return;
    ctx.save();
    ctx.globalAlpha = clamp((dur - t) / 0.35, 0, 1);
    ctx.translate(W / 2, H * 0.42 - hop);
    if (popNum.big) ctx.rotate(Math.sin(t * 6) * 0.08);
    ctx.font = `900 ${Math.round(size)}px "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.12; ctx.strokeStyle = popNum.big ? '#9d4edd' : '#7a4a24';
    ctx.strokeText(String(popNum.n), 0, 0);
    if (popNum.big) {
      const g = ctx.createLinearGradient(0, -size * 0.4, 0, size * 0.4);
      RAINBOW.forEach((c, i) => g.addColorStop(i / (RAINBOW.length - 1), c));
      ctx.fillStyle = g;
    } else ctx.fillStyle = '#ffd23f';
    ctx.fillText(String(popNum.n), 0, 0);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText(String(popNum.n), -size * 0.03, -size * 0.04);

  }
  function drawControls() {
    screen();

      const b = BTN[name], on = input[name], glow = name === 'up' && portalHere;
      ctx.save(); ctx.translate(b.x, b.y);
      const s = on ? 0.92 : glow ? 1 + 0.1 * Math.sin(T * 8) : 1; ctx.scale(s, s);
      circ(0, 0, b.r, on ? 'rgba(255,255,255,0.75)' : glow ? 'rgba(255,214,90,0.85)' : 'rgba(255,255,255,0.38)');
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = b.r * 0.08;
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.stroke();
      ctx.fillStyle = on ? '#2f8a4a' : 'rgba(40,110,60,0.85)';
      if (name === 'jump') {
        // Jump is a big star, so it doesn't look like the up arrow.

        starPath(0, 0, b.r * 0.55, -Math.PI / 2); ctx.fill();
      } else {
        const a = b.r * 0.45;
        ctx.rotate(ROT[name]);
        ctx.beginPath(); ctx.moveTo(a, 0); ctx.lineTo(-a * 0.6, -a); ctx.lineTo(-a * 0.6, a); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }

  // ---------- Win screen buttons ----------
  function winButtons() {
    const r = S * 0.13;
    return { replay: { x: W / 2 - r * 1.3, y: H * 0.4, r }, animals: { x: W / 2 + r * 1.3, y: H * 0.4, r } };
  }
  function drawWinButtons() {
    if (winT < 2.2) return;
    screen();
    const B = winButtons(), a = Math.min(1, (winT - 2.2) * 3), pulse = 1 + 0.05 * Math.sin(T * 5);
    ctx.globalAlpha = a;
    for (const [name, b, col, dark, idx] of [['replay', B.replay, '#4cc93a', '#2b8a00', 0], ['animals', B.animals, '#ff9f1c', '#d97706', 1]]) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.scale(pulse * a, pulse * a);
      if (pad.active && winSel === idx) circ(0, 0, b.r * 1.18, '#ffcf33');
      circ(0, b.r * 0.1, b.r, dark); circ(0, 0, b.r, col);
      ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineCap = 'round';
      if (name === 'replay') {
        ctx.lineWidth = b.r * 0.16;
        ctx.beginPath(); ctx.arc(0, 0, b.r * 0.48, -Math.PI * 0.35, Math.PI * 1.35); ctx.stroke();
        const ax = Math.cos(-Math.PI * 0.35) * b.r * 0.48, ay = Math.sin(-Math.PI * 0.35) * b.r * 0.48;
        ctx.beginPath(); ctx.moveTo(ax + b.r * 0.22, ay - b.r * 0.05); ctx.lineTo(ax - b.r * 0.12, ay - b.r * 0.22); ctx.lineTo(ax - b.r * 0.02, ay + b.r * 0.2); ctx.closePath(); ctx.fill();
      } else {
        ell(0, b.r * 0.18, b.r * 0.3, b.r * 0.25, 0, '#fff');
        for (const [dx, dy] of [[-0.36, -0.12], [-0.13, -0.36], [0.13, -0.36], [0.36, -0.12]]) ell(dx * b.r, dy * b.r, b.r * 0.11, b.r * 0.14, 0, '#fff');
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Animal select ----------
  const CARD_COLORS = { squirrel: '#ffd9b3', puppy: '#fff0b3', raccoon: '#dfe3f0', bird: '#cfeaff' };
  let cards = [], chosen = -1, chosenT = 0;
  function layoutCards() {
    const cols = W >= H * 1.15 ? 4 : 2, rows = 4 / cols;
    const mx = W * 0.06, gap = S * 0.04;
    const cw = (W - 2 * mx - gap * (cols - 1)) / cols;
    const ch = Math.min((H * 0.84 - gap * (rows - 1)) / rows, cw * 1.25);
    const top = (H - (ch * rows + gap * (rows - 1))) / 2;
    cards = ANIMALS.map((k, i) => ({ kind: k, x: mx + (i % cols) * (cw + gap), y: top + Math.floor(i / cols) * (ch + gap), w: cw, h: ch }));
  }
  function goSelect() { state = 'select'; chosen = -1; clearInput(); particles.length = 0; uiParts.length = 0; }
  function drawSelect() {
    drawScene(false);
    screen();
    cards.forEach((c, i) => {
      const isC = chosen === i, isSel = chosen < 0 && pad.active && padSel === i;
      const lift = isC ? Math.abs(Math.sin(chosenT * 9)) * c.h * 0.12 : 0;
      const s = isC ? 1.06 : isSel ? 1.06 + 0.03 * Math.sin(T * 6) : 1 + 0.02 * Math.sin(T * 2 + i);
      ctx.save(); ctx.translate(c.x + c.w / 2, c.y + c.h / 2); ctx.scale(s, s);
      const r = Math.min(c.w, c.h) * 0.12;
      ctx.fillStyle = 'rgba(0,0,0,0.12)'; rr(-c.w / 2 + 4, -c.h / 2 + 8, c.w, c.h, r); ctx.fill();
      ctx.fillStyle = CARD_COLORS[c.kind]; rr(-c.w / 2, -c.h / 2, c.w, c.h, r); ctx.fill();
      ctx.strokeStyle = isC || isSel ? '#ffcf33' : '#ffffff'; ctx.lineWidth = Math.max(4, c.w * (isSel ? 0.06 : 0.03)); ctx.stroke();
      const as = Math.min(c.w, c.h) / 95;
      ell(0, c.h * 0.3, 28 * as, 6 * as, 0, 'rgba(0,0,0,0.12)');
      drawAnimal(c.kind, 0, c.h * 0.3 - lift, as, 1, { t: T + i, run: 0, air: lift > 2, sx: 1, sy: 1,
        blink: Math.sin(T * 1.3 + i * 2) > 0.97, happy: isC });
      ctx.restore();
    });
    drawParticleList(uiParts);
  }
  function selectTap(x, y) {
    if (chosen >= 0) return;
    const i = cards.findIndex(c => x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h);
    if (i < 0) { burst(x, y, 8, SPARK, 0.5, 1, 1.2, 300, uiParts); SFX.sparkle(); return; }
    chooseCard(i);
  }
  function chooseCard(i) {
    chosen = i; chosenT = 0; padSel = i;
    SFX.voice(cards[i].kind);
    const c = cards[i];
    burst(c.x + c.w / 2, c.y + c.h * 0.4, 30, RAINBOW.concat(SPARK), 1.3, 0.6, 1.4, 600, uiParts);
  }
  function winTap(x, y) {
    if (winT < 2.2) { burst(x, y, 8, SPARK, 0.5, 1, 1.2, 300, uiParts); SFX.sparkle(); return; }
    const B = winButtons();
    if (Math.hypot(x - B.replay.x, y - B.replay.y) < B.replay.r * 1.2) { SFX.hop(); startLevel(player.kind); }
    else if (Math.hypot(x - B.animals.x, y - B.animals.y) < B.animals.r * 1.2) { SFX.hop(); goSelect(); }
    else { burst(x, y, 8, SPARK, 0.5, 1, 1.2, 300, uiParts); SFX.sparkle(); }
  }

  // ---------- Main loop ----------
  let last = 0;
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000 || 0);
    last = now; T += dt;
    const pp = pollPad();
    refreshInput();
    if (state === 'title') {
      if (pp.jump) startGame();
      requestAnimationFrame(frame);
      return;
    }
    if (state === 'select' && chosen < 0) {
      const cols = W >= H * 1.15 ? 4 : 2;
      if (pp.left) { padSel = (padSel + 3) % 4; SFX.sparkle(); }
      if (pp.right) { padSel = (padSel + 1) % 4; SFX.sparkle(); }
      if (cols === 2 && (pp.up || pp.down)) { padSel = (padSel + 2) % 4; SFX.sparkle(); }
      if (pp.jump) { initAudio(); chooseCard(padSel); }
    } else if (state === 'play') {
      if (pp.jump) { initAudio(); jumpQueued = true; }
      if (pp.up) upQueued = true;
    } else if (state === 'win' && winT > 2.2) {
      if (pp.left && winSel !== 0) { winSel = 0; SFX.sparkle(); }
      if (pp.right && winSel !== 1) { winSel = 1; SFX.sparkle(); }
      if (pp.jump) { SFX.hop(); if (winSel === 0) startLevel(player.kind); else goSelect(); }
    }
    if (state === 'select') {
      camX = (Math.sin(T * 0.05) * 0.5 + 0.5) * 2600;
      chosenT += dt;
      if (chosen >= 0 && chosenT > 1.0) startLevel(cards[chosen].kind);
      updateAmbience(dt);
      drawSelect();
    } else if (state === 'play' || state === 'win') {
      updatePlay(dt);
      updateAmbience(dt);
      drawScene(true);
      drawHUD();
      if (state === 'play') drawControls();
      else drawWinButtons();
      drawPopNum();
      screen(); drawParticleList(uiParts);
      drawTransition();
    }
    requestAnimationFrame(frame);
  }

  // Circle wipe: closes around the animal, switches place, then opens again.
  function drawTransition() {
    if (!trans) return;
    screen();
    const k = trans.t / trans.dur, closed = easeInOut(clamp(k < 0.5 ? k * 2 : (1 - k) * 2, 0, 1));
    const p = player, px = (p.x - camX) * sc, py = offY + (p.y - 35) * sc;
    const r = Math.hypot(W, H) * (1 - closed);
    ctx.fillStyle = `rgb(${trans.color})`;
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(px, py, Math.max(0, r), 0, TAU, true); ctx.fill('evenodd');
  }

  // ---------- Events ----------
  window.addEventListener('resize', resize);
  resize();

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    const x = e.clientX, y = e.clientY;
    if (state === 'play') {
      const r = roleFor(x, y);
      pointers.set(e.pointerId, r);
      if (r === 'jump') jumpQueued = true;
      if (r === 'up') upQueued = true;
      refreshInput();
    } else if (state === 'select') selectTap(x, y);
    else if (state === 'win') winTap(x, y);
  });
  canvas.addEventListener('pointermove', e => {
    const r = pointers.get(e.pointerId);
    if (!r || r === 'jump' || e.clientX > W * 0.5) return;
    const nr = roleFor(e.clientX, e.clientY);
    if (nr === 'up' && r !== 'up') upQueued = true; // sliding a thumb onto up counts as a press
    pointers.set(e.pointerId, nr);
    refreshInput();
  });
  const release = e => { if (pointers.delete(e.pointerId)) refreshInput(); };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', release);

  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down', Space: 'jump' };
  window.addEventListener('keydown', e => {
    const k = KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    initAudio();
    if (state !== 'play') {
      if (state === 'win' && k === 'jump' && winT > 2.2 && !e.repeat) startLevel(player.kind);
      return;
    }
    if (k === 'jump' && !e.repeat && !keys.jump) jumpQueued = true;
    if (k === 'up' && !e.repeat && !keys.up) upQueued = true;
    keys[k] = true; refreshInput();
  });
  window.addEventListener('keyup', e => {
    const k = KEYMAP[e.code];
    if (!k) return;
    keys[k] = false; refreshInput();
  });
  window.addEventListener('blur', clearInput);

  ['contextmenu', 'gesturestart', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearInput();
    if (!actx) return;
    if (document.hidden) actx.suspend(); else actx.resume();
  });

  function startGame() {
    if (state !== 'title') return;
    initAudio();
    tone(523.25, 0, 0.3); tone(659.25, 0.1, 0.3); tone(783.99, 0.2, 0.5);
    const el = document.documentElement;
    const fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fs) { try { const p = fs.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    document.getElementById('start').remove();
    goSelect();
  }
  document.getElementById('play').addEventListener('click', startGame);
  // The loop runs from the start so a controller's A button can press Play.
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
