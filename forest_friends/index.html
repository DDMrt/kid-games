<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forest Friends">
<meta name="theme-color" content="#7fd3ff">
<title>Forest Friends</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #7fd3ff;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #start {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#7fd3ff, #c9f1ff 55%, #9be08a 56%, #5cc640);
  }
  #play {
    width: min(42vw, 42vh); height: min(42vw, 42vh); border-radius: 50%; border: none;
    background: #4cc93a; box-shadow: 0 14px 0 #2b8a00; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    animation: pulse 1.2s ease-in-out infinite;
  }
  #play svg { width: 48%; height: 48%; margin-left: 9%; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  /* Phones held upright: the game is too narrow, so cover it with a "turn me sideways" picture.
     iPhone ignores the manifest's landscape setting, so this is the only way to keep it landscape. */
  #rotate {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center;
    background: linear-gradient(#7fd3ff, #c9f1ff 55%, #9be08a 56%, #5cc640);
  }
  #rotate svg { width: 70vw; height: 70vw; }
  #rotate .phone { transform-origin: 50px 50px; animation: turn 2.6s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform: rotate(0deg); } 55%, 90% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
  @media (orientation: portrait) and (max-width: 600px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate" aria-label="Turn the phone sideways">
  <svg viewBox="0 0 100 100">
    <path d="M 22 30 A 34 34 0 0 1 70 16" fill="none" stroke="#ffcf3a" stroke-width="6" stroke-linecap="round"/>
    <polygon points="64,6 80,16 64,26" fill="#ffcf3a"/>
    <g class="phone">
      <rect x="32" y="20" width="36" height="60" rx="7" fill="#fff" stroke="#3a2b63" stroke-width="3"/>
      <rect x="37" y="28" width="26" height="44" rx="3" fill="#7fd3ff"/>
      <rect x="37" y="58" width="26" height="14" rx="2" fill="#5cc640"/>
      <circle cx="50" cy="52" r="6" fill="#c98a4b"/>
    </g>
  </svg>
</div>
<div id="start">
  <button id="play" aria-label="Play">
    <svg viewBox="0 0 10 10"><polygon points="1,0 10,5 1,10" fill="#fff"/></svg>
  </button>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;

  // ---------- World constants (world units; the world is 720 units tall) ----------
  const VH = 720, GY = 610, LOCK_Y = 470;
  let LEVEL_W = 5600, GATE_X = 5200; // set per level in startLevel (the beach is longer)
  const WALK = 300, GRAV = 2300, JUMP_V = 920, DJUMP_V = 820, GLIDE = 210;

  let W = 0, H = 0, S = 0, dpr = 1, sc = 1, offY = 0, viewW = 0, viewTop = 0;
  let skyGrad = null, sunGrad = null, caveGrad = null, nightGrad = null, moonGrad = null, beachSkyGrad = null, seaCaveGrad = null, MOON = null, BTN = {};
  let state = 'title', T = 0, camX = 0;

  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const approach = (v, t, d) => v < t ? Math.min(t, v + d) : Math.max(t, v - d);
  const lerp = (a, b, k) => a + (b - a) * k;
  const easeInOut = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  const easeOut = k => 1 - Math.pow(1 - k, 3);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight; S = Math.min(W, H);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    sc = Math.min(H / VH, W / 760);
    offY = H - VH * sc; viewW = W / sc; viewTop = -offY / sc;
    caveGrad = ctx.createLinearGradient(0, 0, 0, H);
    caveGrad.addColorStop(0, '#1d1538'); caveGrad.addColorStop(1, '#3a2b63');
    skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#7fd3ff'); skyGrad.addColorStop(0.55, '#c9f1ff'); skyGrad.addColorStop(1, '#fff3cf');
    sunGrad = ctx.createRadialGradient(W * 0.82, H * 0.1, 0, W * 0.82, H * 0.1, S * 0.45);
    sunGrad.addColorStop(0, 'rgba(255,250,215,0.95)'); sunGrad.addColorStop(1, 'rgba(255,250,215,0)');
    nightGrad = ctx.createLinearGradient(0, 0, 0, H);
    nightGrad.addColorStop(0, '#0b1030'); nightGrad.addColorStop(0.6, '#1c2558'); nightGrad.addColorStop(1, '#3a3f78');
    // A big, low harvest moon: below the treetops (world y ~290) so it shows between the trees.
    MOON = { x: W * 0.7, y: offY + 285 * sc, r: 92 * sc };
    moonGrad = ctx.createRadialGradient(MOON.x, MOON.y, MOON.r * 0.8, MOON.x, MOON.y, MOON.r * 3.6);
    moonGrad.addColorStop(0, 'rgba(255,190,100,0.45)'); moonGrad.addColorStop(1, 'rgba(255,190,100,0)');
    beachSkyGrad = ctx.createLinearGradient(0, 0, 0, H);
    beachSkyGrad.addColorStop(0, '#8fd0f2'); beachSkyGrad.addColorStop(0.6, '#d6effa'); beachSkyGrad.addColorStop(1, '#eef8fb');
    seaCaveGrad = ctx.createLinearGradient(0, 0, 0, H);
    seaCaveGrad.addColorStop(0, '#0e2530'); seaCaveGrad.addColorStop(1, '#1d4652');
    const R = clamp(S * 0.11, 34, 72), pad = Math.max(18, R * 0.45);
    // Left: a + shaped pad (up/down/left/right). Right: jump.
    const br = R * 0.82, d = R * 1.32, cx = pad + d + br, cy = H - pad - d - br;
    BTN = {
      pad: { x: cx, y: cy },
      up: { x: cx, y: cy - d, r: br },
      down: { x: cx, y: cy + d, r: br },
      left: { x: cx - d, y: cy, r: br },
      right: { x: cx + d, y: cy, r: br },
      jump: { x: W - pad - R * 1.3, y: H - pad - R * 1.3, r: R * 1.3 },
    };
    layoutCards();
  }

  // ---------- Level layout ----------
  // Each tree: x position and branches [y, side (-1 left / 1 right), length].
  const TREES = [
    { x: 500, b: [[480, 1, 170]] },
    { x: 1050, b: [[470, -1, 160], [340, 1, 180]] },
    { x: 1650, b: [[460, 1, 200], [320, -1, 170]] },
    { x: 2250, b: [[470, -1, 180], [350, 1, 160], [230, -1, 150]] },
    { x: 2850, b: [[470, 1, 170], [350, -1, 170], [230, 1, 190]] }, // the key tree
    { x: 3500, b: [[460, -1, 190], [330, 1, 170]] },

  const PLATS = [];
  for (const t of TREES) for (const [y, side, len] of t.b) {

  }
  // Secret cave: its mouth sits on the forest floor at CAVE_X; press up there to go in.
  // Inside is a small room (CAVE_W wide) with the key on a high ledge, and the way out near the left (caveExitX(), just right of the arrow pad).
  const CAVE_X = 3120, CAVE_W = 1500, CAVE_EXIT_X = 170;
  const CAVE_PLATS = [{ x1: 620, x2: 830, y: 470, rock: true }, { x1: 900, x2: 1130, y: 360, rock: true }];
  const KEY_POS = { x: 1015, y: 300 }; // inside the cave
  const CRYSTALS = [
    [330, GY, 1.1, '#7be0ff'], [520, GY, 0.8, '#ff8fd8'], [760, 470, 0.7, '#c8a2ff'], [1200, GY, 1.3, '#7be0ff'],
    [1350, GY, 0.9, '#ff8fd8'], [1080, 360, 0.6, '#7be0ff'], [430, 140, -0.9, '#c8a2ff'], [880, 120, -1.1, '#7be0ff'],
    [1280, 150, -0.8, '#ff8fd8'], [640, 110, -0.7, '#7be0ff'],
  ];
  // [kind, x, minX, maxX, surfaceY]
  const ENEMY_DEFS = [
    ['beetle', 850, 700, 980, GY], ['beetle', 1420, 1260, 1560, GY], ['beetle', 1780, 1700, 1870, 460],
    ['slime', 2000, 1880, 2120, GY], ['beetle', 2600, 2480, 2700, GY], ['slime', 3350, 3290, 3440, GY],
    ['slime', 3620, 3550, 3690, 330], ['beetle', 3900, 3760, 4020, GY], ['beetle', 4400, 4280, 4520, GY],
    ['slime', 4850, 4740, 4980, GY],
  ];

  const FLOWER_COLORS = ['#ff6fa8', '#ffd23f', '#b48cff', '#ff8c42', '#6ec6ff', '#ffffff'];
  const RAINBOW = ['#ff4d6d', '#ff9f1c', '#ffd60a', '#4cc93a', '#3a86ff', '#9d4edd'];
  const SPARK = ['#fff7a8', '#ffffff', '#ffe066', '#c9f7ff'];
  const LEAF_COLORS = ['#7ccf5a', '#f5b942', '#ff8c42', '#a8e05f', '#e9c46a'];
  const BUTTERFLY_COLORS = [['#ff7ab6', '#ffc2de'], ['#ffd23f', '#fff0a8'], ['#6ec6ff', '#c9ecff'], ['#c38bff', '#e7d4ff'], ['#ff9f43', '#ffd8a8']];
  const FAIRY = ['#ffb3e6', '#d9b8ff', '#b8f0ff', '#ffffff', '#fff3a8'];
  const SLIME = { body: '#c7a4f5', base: '#9f78dc', light: '#efe3ff', mouth: '#5b3a8f' }; // lilac, so it stands out from the greens
  // Five acorns, each sitting on a branch: [x, y]
  const ACORN_POS = [[640, 440], [1200, 300], [2120, 190], [3650, 290], [3970, 300]];
  // Level 2 (night): the same forest, ghosts instead of beetles, and a torch on the top branch of the tree before the cave.
  // The night forest has its own tree layout, creatures and acorn spots (the cave stays at CAVE_X).
  const TREES_2 = [
    { x: 620, b: [[470, -1, 170], [350, 1, 160]] },
    { x: 1200, b: [[480, 1, 190], [360, -1, 150], [240, 1, 160]] },
    { x: 1780, b: [[460, -1, 180], [330, 1, 180]] },
    { x: 2350, b: [[470, 1, 170], [350, -1, 180], [230, 1, 170]] }, // the torch tree
    { x: 2760, b: [[450, -1, 160]] },
    { x: 3550, b: [[460, 1, 180], [340, -1, 170]] },
    { x: 4150, b: [[470, -1, 190], [350, 1, 170], [240, -1, 150]] },
    { x: 4700, b: [[460, 1, 170]] },
  ];
  const PLATS_2 = [];
  for (const t of TREES_2) for (const [y, side, len] of t.b) {
    PLATS_2.push({ y, side, tx: t.x, x1: side > 0 ? t.x + 25 : t.x - 35 - len, x2: side > 0 ? t.x + 35 + len : t.x - 25 });
  }
  const ENEMY_DEFS_2 = [
    ['ghost', 900, 760, 1050, GY], ['slime', 1480, 1400, 1600, GY], ['ghost', 1690, 1600, 1740, 460],
    ['ghost', 2050, 1950, 2200, GY], ['slime', 2620, 2560, 2700, GY], ['ghost', 3380, 3300, 3480, GY],
    ['slime', 3650, 3600, 3740, 460], ['ghost', 3900, 3800, 4050, GY], ['slime', 4450, 4350, 4560, GY],
    ['ghost', 4850, 4790, 4960, GY],
  ];
  const ACORN_POS_2 = [[740, 320], [1330, 210], [1620, 430], [3420, 310], [4030, 210]];
  const TORCH_POS = { x: 2480, y: 230 }; // bottom of the handle, standing on the top branch of the tree before the cave
  const FIREFLY = ['#f4ff9a', '#d8ff7a', '#fff3a0'];
  const NIGHT_LEAVES = ['#3f7a6a', '#8a6a3a', '#7a5a5a', '#4f8a70'];
  const GHOST_POP = ['#ffffff', '#dfe9ff', '#bfe0ff', '#f0e6ff'];

  // Scenery colors: day (level 1) and night (level 2).
  const DAY = {
    hill1: '#d2f0e0', hill2: '#b3e3c7', midTrunk: '#93b59d', midLeaf: '#9fd4a8', midBush: '#82c98c',
    trunk: '#8b5a3c', trunkHi: '#a3704c', bark: '#744a30', knot: '#4a2e1d', canopy: ['#3f9f4f', '#56bd5c', '#7fd96f'],
    branch: '#7d4f33', branchTop: '#a06a45', leaf1: '#4fb357', leaf2: '#63c766', blossom: '#ff9ccb',
    dirt: '#9b6b47', pebble: '#86593a', grass: '#5cc640', grassHi: '#82dd5e', blade: '#4fb83a', stem: '#3e9a3a',
    rock: '#8f88ad', rockHi: '#a39dc0', moss: '#5cc640', mushGlow: 0.18,
  };
  const NIGHT = {
    hill1: '#2c3870', hill2: '#24305f', midTrunk: '#2b3a62', midLeaf: '#2f4a72', midBush: '#284566',
    trunk: '#4e3b52', trunkHi: '#62506a', bark: '#3b2c42', knot: '#21182a', canopy: ['#1d4648', '#295c58', '#3d7a6c'],
    branch: '#5c4458', branchTop: '#c9bce6', leaf1: '#2f6a5a', leaf2: '#3f7e68', blossom: '#ffb3e0',
    dirt: '#4a3a4c', pebble: '#3d3042', grass: '#2f6a52', grassHi: '#9fd8c0', blade: '#2a5e48', stem: '#2a5a48',
    rock: '#4c4874', rockHi: '#5d5986', moss: '#2f6a52', mushGlow: 0.32,
  };
  let P = DAY;
  // Stars for the night sky (screen fractions).
  const STARS = [];
  for (let i = 0; i < 70; i++) STARS.push({ x: hash(i * 2.9 + 5), y: hash(i * 7.3 + 1) * 0.55, s: 0.6 + hash(i * 3.1) * 1.2, ph: hash(i * 1.1) * TAU });

  // ---------- Level 3: Pacific Northwest beach (day) ----------
  // A big bay: cliffs with evergreens on both sides in the background, the ocean in the middle at low tide.
  // Rocks and driftwood are solid (jump on or over them); tidepools bounce the animal back to the edge.
  // Halfway along, a tall cliff blocks the beach: the only way past is through the sea cave, which has the key up high.
  const MAX_LEVEL = 4;
  const BEACH3 = {
    // The cliff: on the near side it rises behind the beach from back1, with the cave door (mouthL) in it; the animal
    // can walk past the door until the cliff juts out at wall1. The far side mirrors it: a jut ending at wall2, the
    // far door (mouthR), and the cliff behind the beach until back2. Nobody can cross from wall1 to wall2 except
    // through the cave, and the camera never shows past the jut.
    cliff: { back1: 2640, wall1: 3300, wall2: 3700, back2: 5050, mid: 3500 }, mouthL: 2850, mouthR: 4800, caveW: 2700,
    // solid things on the beach: rocks, single logs, driftwood piles, and the cliff jut (too tall to jump)
    solids: [
      { x1: 470, x2: 610, top: GY - 52, type: 'log' },
      { x1: 1040, x2: 1160, top: GY - 110, type: 'rock' },
      { x1: 1480, x2: 1680, top: GY - 135, type: 'pile' },
      { x1: 2230, x2: 2310, top: GY - 75, type: 'rock' },
      { x1: 2310, x2: 2440, top: GY - 155, type: 'rock' },
      { x1: 3050, x2: 3170, top: GY - 115, type: 'rock' }, // along the cliff, past the door (shell 4)
      { x1: 3300, x2: 3700, top: -2000, type: 'cliff' },
      // left of the far door, far enough that it starts off screen when the animal comes out (shell 5)
      { x1: 3880, x2: 4010, top: GY - 120, type: 'rock' },
      { x1: 5420, x2: 5610, top: GY - 100, type: 'pile' },
      { x1: 6270, x2: 6350, top: GY - 80, type: 'rock' },
      { x1: 6350, x2: 6470, top: GY - 165, type: 'rock' },
      { x1: 6880, x2: 7010, top: GY - 50, type: 'log' },
    ],
    pools: [{ x1: 760, x2: 910 }, { x1: 1830, x2: 1990 }, { x1: 5770, x2: 5940 }, { x1: 6600, x2: 6760 }],
    // [kind, x, minX, maxX, surfaceY]
    enemies: [
      ['crab', 1300, 1190, 1440, GY], ['hopper', 1750, 1705, 1805, GY], ['hopper', 2100, 2020, 2200, GY],
      ['crab', 2530, 2470, 2600, GY], ['crab', 5250, 5110, 5390, GY], ['hopper', 6100, 5980, 6240, GY],
      ['crab', 6550, 6500, 6570, GY],
    ],
    // shells sit on top of rocks and driftwood piles: [x, y]
    shells: [[1100, GY - 150], [1580, GY - 175], [2375, GY - 195], [3110, GY - 155], [3945, GY - 160]],
    key: { x: 1110, y: 165 },
    // the sea cave: rock steps up to a high ledge with the key, then a tidepool and more rocks before the far opening
    caveSolids: [
      { x1: 640, x2: 770, top: GY - 100, type: 'rock' }, { x1: 770, x2: 890, top: GY - 200, type: 'rock' },
      { x1: 890, x2: 1010, top: GY - 300, type: 'rock' },
      { x1: 1700, x2: 1810, top: GY - 120, type: 'rock' }, { x1: 1960, x2: 2060, top: GY - 90, type: 'rock' },
      { x1: 2060, x2: 2170, top: GY - 170, type: 'rock' },
    ],
    cavePlats: [{ x1: 1010, x2: 1220, y: GY - 385, rock: true }],
    cavePools: [{ x1: 1400, x2: 1570 }],
  };
  // Level 4 (sunset): the same sea cave inside, but the rocks, driftwood, pools and sea glass are rearranged,
  // and the near stretch of cliff is longer so the torch (past the cave door) starts out of view.
  const BEACH4 = {
    caveW: BEACH3.caveW, key: BEACH3.key, caveSolids: BEACH3.caveSolids, cavePlats: BEACH3.cavePlats, cavePools: BEACH3.cavePools,
    cliff: { back1: 2640, wall1: 4200, wall2: 4600, back2: 5250, mid: 4400 }, mouthL: 2850, mouthR: 5000,
    solids: [
      { x1: 820, x2: 930, top: GY - 95, type: 'rock' },
      { x1: 1100, x2: 1250, top: GY - 55, type: 'log' },
      { x1: 1400, x2: 1610, top: GY - 140, type: 'pile' },
      { x1: 2060, x2: 2140, top: GY - 70, type: 'rock' },
      { x1: 2140, x2: 2270, top: GY - 150, type: 'rock' },
      { x1: 3300, x2: 3420, top: GY - 100, type: 'rock' },
      { x1: 3920, x2: 4060, top: GY - 90, type: 'rock' }, // the torch stands on this one
      { x1: 4200, x2: 4600, top: -2000, type: 'cliff' },
      { x1: 4700, x2: 4800, top: GY - 80, type: 'rock' },
      { x1: 5400, x2: 5600, top: GY - 120, type: 'pile' },
      { x1: 6250, x2: 6380, top: GY - 130, type: 'rock' },
      { x1: 6700, x2: 6830, top: GY - 50, type: 'log' },
    ],
    pools: [{ x1: 520, x2: 660 }, { x1: 1760, x2: 1910 }, { x1: 3550, x2: 3700 }, { x1: 5750, x2: 5910 }],
    enemies: [
      ['hopper', 740, 690, 800, GY], ['crab', 1000, 950, 1080, GY], ['hopper', 1330, 1270, 1385, GY],
      ['crab', 1980, 1925, 2045, GY], ['crab', 2450, 2330, 2560, GY], ['crab', 6050, 5950, 6200, GY],
      ['hopper', 6500, 6420, 6620, GY],
    ],
    shells: [[875, GY - 135], [1505, GY - 180], [2205, GY - 190], [3360, GY - 140], [5500, GY - 160]], // sea glass
    torch: { x: 3990, y: GY - 90 },
  };
  let B = BEACH3; // the current beach (set in startLevel)
  // Sea glass colors: aqua, green, cobalt, amber, lavender.
  const GLASS_COLORS = ['#7fe8d8', '#7ddc6e', '#5a8fff', '#ffb54d', '#e3a0ff'];
  // One color pair per shell: scallop, conch, spiral snail, cowrie, auger.
  const SHELL_COLORS = [['#ff8fb1', '#ffd0dd'], ['#ffb36b', '#ff7aa2'], ['#b48cff', '#efe3ff'], ['#ffd23f', '#fff3b0'], ['#4fc3e8', '#d6f4ff']];
  const CRAB_POP = ['#ff5a3c', '#ffb199', '#ffd23f'], HOPPER_POP = ['#6cc5b0', '#c9f2e8', '#ffffff'];
  const NEXT_COLOR = { 2: '14,18,52', 3: '190,232,250', 4: '70,36,80' }; // the wipe color when a gate leads into that level

  const FLOWERS = [], MUSH = [], MOTES = [];
  for (let i = 0; i * 70 < LEVEL_W; i++) {
    if (hash(i * 7.7) < 0.35) continue;
    FLOWERS.push({ x: i * 70 + hash(i * 3.3) * 40, h: 22 + hash(i * 9.1) * 22,
      c: FLOWER_COLORS[(hash(i * 4.4) * FLOWER_COLORS.length) | 0], ph: hash(i * 1.9) * TAU });
  }
  for (let i = 0; i * 330 < LEVEL_W; i++) {
    if (hash(i * 13.1) < 0.4) continue;
    MUSH.push({ x: i * 330 + 120 + hash(i * 2.2) * 100, c: hash(i * 6.6) < 0.5 ? '#ff5d73' : '#b48cff', s: 0.8 + hash(i * 8.8) * 0.5, ph: hash(i) * TAU });
  }

  // The big bouncing number in the middle of the screen when an acorn is picked up.

    chooseLevel(i);
  }
  // Each card is a little picture of its level: sunny forest or night forest with the moon.
  function drawLevelPicture(c, night) {
    const r = c.h * 0.1;
    ctx.save(); rr(c.x, c.y, c.w, c.h, r); ctx.clip();
    const g = ctx.createLinearGradient(0, c.y, 0, c.y + c.h);
    if (night) { g.addColorStop(0, '#0b1030'); g.addColorStop(1, '#3a3f78'); } else { g.addColorStop(0, '#7fd3ff'); g.addColorStop(1, '#fff3cf'); }
    ctx.fillStyle = g; ctx.fillRect(c.x, c.y, c.w, c.h);
    const u = c.h / 100, X = v => c.x + v * c.w / 130, Y = v => c.y + v * u;
    if (night) {
      for (let i = 0; i < 14; i++) circ(X(hash(i * 3.7) * 130), Y(hash(i * 5.1) * 45), u * (0.5 + hash(i) * 0.7), '#fffbe8');
      circ(X(95), Y(28), u * 22, 'rgba(255,190,100,0.25)'); circ(X(95), Y(28), u * 15, '#f7b555');
      circ(X(90), Y(24), u * 3, 'rgba(214,130,50,0.4)'); circ(X(100), Y(33), u * 4, 'rgba(214,130,50,0.4)');
      ctx.save(); ctx.translate(X(78), Y(22)); ctx.scale(u * 0.35, u * 0.35); ctx.fillStyle = '#1a1430';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-12, -14, -26, -6); ctx.quadraticCurveTo(-14, 0, 0, 6);
      ctx.quadraticCurveTo(14, 0, 26, -6); ctx.quadraticCurveTo(12, -14, 0, 0); ctx.fill(); ctx.restore();
    } else {
      circ(X(100), Y(22), u * 22, 'rgba(255,250,215,0.6)'); circ(X(100), Y(22), u * 12, '#fff6c2');
    }
    const Q = night ? NIGHT : DAY;
    ctx.fillStyle = Q.hill1; ctx.beginPath();
    for (const [hx, hr] of [[10, 30], [50, 36], [95, 30], [130, 34]]) { ctx.moveTo(X(hx) + hr * u, Y(78)); ctx.arc(X(hx), Y(78), hr * u, 0, TAU); }
    ctx.fill();
    // a tree
    ctx.fillStyle = Q.trunk; ctx.fillRect(X(30), Y(40), 9 * u, 50 * u);
    ctx.fillStyle = Q.branch; ctx.fillRect(X(36), Y(62), 26 * u, 4 * u);
    ctx.fillStyle = Q.branchTop; ctx.fillRect(X(36), Y(62), 26 * u, 1.3 * u);
    for (const [cc, gr] of [[Q.canopy[0], 4], [Q.canopy[1], 0], [Q.canopy[2], -6]]) {
      ctx.fillStyle = cc; ctx.beginPath();
      for (const [dx, dy, rr2] of [[-12, 4, 14], [0, -4, 17], [13, 4, 14]]) { ctx.moveTo(X(34) + dx * u + (rr2 + gr) * u, Y(34) + dy * u); ctx.arc(X(34) + dx * u, Y(34) + dy * u, (rr2 + gr) * u, 0, TAU); }
      ctx.fill();
    }
    ctx.fillStyle = Q.grass; ctx.fillRect(c.x, Y(88), c.w, 12 * u);
    ctx.fillStyle = Q.grassHi; ctx.fillRect(c.x, Y(88), c.w, 1.6 * u);
    // the chosen animal standing in it, and a creature from the level
    if (night) {
      for (let i = 0; i < 6; i++) circ(X(60 + hash(i * 9.1) * 60), Y(45 + hash(i * 4.3) * 35), u * 1.6, `rgba(240,255,150,${0.5 + 0.5 * Math.sin(T * 3 + i * 2)})`);
      drawGhost({ x: X(108), y: Y(88), oy: -6 * u + Math.sin(T * 2.4) * 3 * u, dir: -1, t: T, bonk: 0 });
    } else drawSlime({ x: X(108), y: Y(88), oy: 0, dir: -1, t: T, bonk: 0, land: 0 });
    drawAnimal(pickedKind, X(70), Y(88), u * 0.5, 1, { t: T, run: 0, air: false, sx: 1, sy: 1, blink: Math.sin(T * 1.3) > 0.97, happy: true });
    ctx.restore();
  }
  function drawLevels() {
    drawScene(false);
    screen();
    levelCards().forEach((c, i) => {
      const isC = levelChosen === i, isSel = levelChosen < 0 && (pad.active || levelKb) && levelSel === i;
      const lift = isC ? Math.abs(Math.sin(levelT * 9)) * c.h * 0.06 : 0;
      const s = isC ? 1.05 : isSel ? 1.05 + 0.03 * Math.sin(T * 6) : 1 + 0.02 * Math.sin(T * 2 + i);
      ctx.save(); ctx.translate(c.x + c.w / 2, c.y + c.h / 2 - lift); ctx.scale(s, s); ctx.translate(-c.x - c.w / 2, -c.y - c.h / 2);
      const r = c.h * 0.1;
      ctx.fillStyle = 'rgba(0,0,0,0.15)'; rr(c.x + 4, c.y + 8, c.w, c.h, r); ctx.fill();
      if (c.n === 4) drawDuskPicture(c); else if (c.n === 3) drawBeachPicture(c); else drawLevelPicture(c, c.n === 2);
      rr(c.x, c.y, c.w, c.h, r);
      ctx.strokeStyle = isC || isSel ? '#ffcf33' : '#ffffff'; ctx.lineWidth = Math.max(4, c.w * (isSel ? 0.04 : 0.02)); ctx.stroke();
      ctx.restore();
    });
    drawParticleList(uiParts);
  }

  function winTap(x, y) {
    if (winT < 2.2) { burst(x, y, 8, SPARK, 0.5, 1, 1.2, 300, uiParts); SFX.sparkle(); return; }
    const B = winButtons();
    if (Math.hypot(x - B.replay.x, y - B.replay.y) < B.replay.r * 1.2) { SFX.hop(); startLevel(player.kind); }
    else if (Math.hypot(x - B.animals.x, y - B.animals.y) < B.animals.r * 1.2) { SFX.hop(); goSelect(); }
    else { burst(x, y, 8, SPARK, 0.5, 1, 1.2, 300, uiParts); SFX.sparkle(); }
  }

  // ---------- Main loop ----------
  let last = 0;
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000 || 0);
    last = now; T += dt;
    // Phone held upright: the "turn sideways" picture covers the game, so hold everything still.
    if (W < H && W <= 600) { clearInput(); requestAnimationFrame(frame); return; }
    const pp = pollPad();
    refreshInput();
    if (state === 'title') {
      if (pp.jump) startGame();
      requestAnimationFrame(frame);
      return;
    }
    if (state === 'select' && chosen < 0) {
      const cols = W >= H * 1.15 ? 4 : 2;
      if (pp.left) { padSel = (padSel + 3) % 4; SFX.sparkle(); }
      if (pp.right) { padSel = (padSel + 1) % 4; SFX.sparkle(); }
      if (cols === 2 && (pp.up || pp.down)) { padSel = (padSel + 2) % 4; SFX.sparkle(); }
      if (pp.jump) { initAudio(); chooseCard(padSel); }
    } else if (state === 'play') {
      if (pp.jump) { initAudio(); jumpQueued = true; }
      if (pp.up) upQueued = true;
    } else if (state === 'win' && winT > 2.2) {
      if (pp.left && winSel !== 0) { winSel = 0; SFX.sparkle(); }
      if (pp.right && winSel !== 1) { winSel = 1; SFX.sparkle(); }
      if (pp.jump) { SFX.hop(); if (winSel === 0) startLevel(player.kind); else goSelect(); }
    }
    if (state === 'select') {
      camX = (Math.sin(T * 0.05) * 0.5 + 0.5) * 2600;
      chosenT += dt;
      if (chosen >= 0 && chosenT > 1.0) { if (unlocked >= 2) goLevels(cards[chosen].kind); else startLevel(cards[chosen].kind, 1); }
      updateAmbience(dt);
      drawSelect();
    } else if (state === 'levels') {
      if (levelChosen < 0) {
        if (pp.left) moveLevelSel(-1, 0); if (pp.right) moveLevelSel(1, 0);
        if (pp.up) moveLevelSel(0, -1); if (pp.down) moveLevelSel(0, 1);
        if (pp.jump) { initAudio(); chooseLevel(levelSel); }
      }
      camX = (Math.sin(T * 0.05) * 0.5 + 0.5) * 2600;
      levelT += dt;
      if (levelChosen >= 0 && levelT > 1.0) startLevel(pickedKind, levelChosen + 1);
      updateAmbience(dt);
      drawLevels();
    } else if (state === 'play' || state === 'win') {
      updatePlay(dt);
      updateAmbience(dt);
      drawScene(true);
      drawHUD();
      if (state === 'play') drawControls();
      else drawWinButtons();
      drawPopNum();
      screen(); drawParticleList(uiParts);
      drawTransition();
    }
    requestAnimationFrame(frame);
  }

  // Circle wipe: closes around the animal, switches place, then opens again.
  function drawTransition() {
    if (!trans) return;
    screen();
    const k = trans.t / trans.dur, closed = easeInOut(clamp(k < 0.5 ? k * 2 : (1 - k) * 2, 0, 1));
    const p = player, px = (p.x - camX) * sc, py = offY + (p.y - 35) * sc;
    const r = Math.hypot(W, H) * (1 - closed);
    ctx.fillStyle = `rgb(${trans.color})`;
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(px, py, Math.max(0, r), 0, TAU, true); ctx.fill('evenodd');
  }

  // ---------- Events ----------
  window.addEventListener('resize', resize);
  resize();

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    const x = e.clientX, y = e.clientY;
    if (state === 'play') {
      if (e.pointerType === 'mouse') { pointers.set(e.pointerId, 'jump'); jumpQueued = true; refreshInput(); return; } // PC: click = jump
      const r = roleFor(x, y);
      if (!r) { burst(x, y, 6, SPARK, 0.4, 1, 1, 300, uiParts); return; } // not a button: just a little sparkle
      pointers.set(e.pointerId, r);
      if (r === 'jump') jumpQueued = true;
      if (r === 'up') upQueued = true;
      refreshInput();
    } else if (state === 'select') selectTap(x, y);
    else if (state === 'levels') levelsTap(x, y);
    else if (state === 'win') winTap(x, y);
  });
  canvas.addEventListener('pointermove', e => {
    const r = pointers.get(e.pointerId);
    if (!r || r === 'jump' || e.clientX > W * 0.5) return;
    const nr = roleFor(e.clientX, e.clientY);
    if (nr === 'up' && r !== 'up') upQueued = true; // sliding a thumb onto up counts as a press
    pointers.set(e.pointerId, nr);
    refreshInput();
  });
  const release = e => { if (pointers.delete(e.pointerId)) refreshInput(); };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', release);

  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down', Space: 'jump' };
  window.addEventListener('keydown', e => {
    const k = KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    initAudio();
    if (state !== 'play') {
      if (state === 'win' && k === 'jump' && winT > 2.2 && !e.repeat) startLevel(player.kind);
      if (state === 'levels' && levelChosen < 0 && !e.repeat) {
        if (k === 'jump') chooseLevel(levelSel);
        else if (k === 'left' || k === 'right' || k === 'up' || k === 'down') {
          levelKb = true; moveLevelSel(k === 'left' ? -1 : k === 'right' ? 1 : 0, k === 'up' ? -1 : k === 'down' ? 1 : 0);
        }
      }
      return;
    }
    if (k === 'jump' && !e.repeat && !keys.jump) jumpQueued = true;
    if (k === 'up' && !e.repeat && !keys.up) upQueued = true;
    keys[k] = true; refreshInput();
  });
  window.addEventListener('keyup', e => {
    const k = KEYMAP[e.code];
    if (!k) return;
    keys[k] = false; refreshInput();
  });
  window.addEventListener('blur', clearInput);

  ['contextmenu', 'gesturestart', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearInput();
    if (!actx) return;
    if (document.hidden) actx.suspend(); else actx.resume();
  });

  function startGame() {
    if (state !== 'title') return;
    initAudio();
    tone(523.25, 0, 0.3); tone(659.25, 0.1, 0.3); tone(783.99, 0.2, 0.5);
    const el = document.documentElement;
    const fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fs) { try { const p = fs.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    document.getElementById('start').remove();
    goSelect();
  }
  document.getElementById('play').addEventListener('click', startGame);
  // The loop runs from the start so a controller's A button can press Play.
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
